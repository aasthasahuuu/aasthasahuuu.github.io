<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aastha Sahu</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8e4e1;
  --text: #4a2f1f;
  --accent: #8b5e3c;
  --bar-height: 20px;
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding:
    calc(var(--bar-height) + env(safe-area-inset-top, 0px))
    max(5vw, env(safe-area-inset-right, 0px))
    env(safe-area-inset-bottom, 0px)
    max(5vw, env(safe-area-inset-left, 0px));
  font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

.bar {
  position: fixed;
  top: env(safe-area-inset-top, 0px);
  left: 0;
  right: 0;
  display: flex;
  height: var(--bar-height);
}
.bar div { flex: 1; }

body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto 0;
  height: env(safe-area-inset-top, 0px);
  background: var(--bg);
  z-index: 10;
}
.bar { z-index: 11; }

.main-text { max-width: 100%; }

h1 {
  font-size: clamp(2.2rem, 11vw, 4rem);
  margin: 0;
  line-height: 1.1;
  overflow-wrap: break-word;
}

h3 {
  font-weight: normal;
  margin: 10px 0 20px;
  font-size: clamp(1rem, 4.5vw, 1.5rem);
  line-height: 1.35;
}

a {
  display: inline-block;
  padding: 10px 14px;
  color: var(--accent);
  font-size: 1.1rem;
}
</style>
</head>
<body>
<div class="bar">
  <div style="background: #4a2f1f;"></div>
  <div style="background: #7b5039;"></div>
  <div style="background: #b08968;"></div>
  <div style="background: #d9bfa0;"></div>
  <div style="background: #f1e3d0;"></div>
</div>
<div class="main-text">
  <h1>Aastha Sahu</h1>
  <h3>Hieee!! I'm learning coding as hobby</h3>
  <a href="https://github.com/aasthasahuuu">GitHub</a>
</div>
</body>
</html>
